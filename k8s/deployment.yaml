apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-k8s
  namespace: default
  labels:
    app: rag-k8s
spec:
  # replicas is intentionally omitted: the HPA (hpa.yaml) owns the replica
  # count. Setting it here would reset it on every `kubectl apply`.
  selector:
    matchLabels:
      app: rag-k8s
  template:
    metadata:
      labels:
        app: rag-k8s
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: rag-k8s
          # IMAGE_TAG is replaced with the git short SHA by deploy.sh, so the
          # running image always maps to a commit (no silent :latest drift).
          image: rag-k8s-rag-api:IMAGE_TAG
          imagePullPolicy: Never        # use local minikube image
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-k8s-config
          env:
            - name: DEMO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: DEMO_USERNAME
            - name: DEMO_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: DEMO_PASSWORD_HASH
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: JWT_SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: DB_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # Startup: uvicorn only accepts connections after the lifespan
          # finishes, so this passes once the RAG chain is built. Up to 150s.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          # Liveness: cheap, no dependencies, so a DB outage doesn't restart pods.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: chain built and Postgres reachable.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 3