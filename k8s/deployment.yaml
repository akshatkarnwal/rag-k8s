apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-k8s
  namespace: default
  labels:
    app: rag-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-k8s
  template:
    metadata:
      labels:
        app: rag-k8s
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: rag-k8s
          image: rag-k8s:latest
          imagePullPolicy: Never        # use local minikube image
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-k8s-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: DB_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5