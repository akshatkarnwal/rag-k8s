apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-k8s-config
  namespace: default
data:
  DB_HOST: "pgvector-service"
  DB_PORT: "5432"
  DB_NAME: "vectordb"
  DB_USER: "postgres"
  # Pods must not re-embed the whole corpus on every start.
  # Ingestion is a one-off: run ingest-job.yaml (deploy.sh --ingest).
  INGEST_ON_STARTUP: "false"