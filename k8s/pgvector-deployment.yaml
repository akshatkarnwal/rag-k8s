apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: default
spec:
  replicas: 1
  # Recreate: the old pod stops before the new one starts, so two Postgres
  # processes never share the same ReadWriteOnce volume during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-k8s-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "vectordb"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Don't send traffic (or let API pods pass readiness) until Postgres accepts connections.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "vectordb"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgvector-pvc