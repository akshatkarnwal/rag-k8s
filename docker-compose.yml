services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=pgvector
      - DB_PORT=5432
      - DB_NAME=vectordb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - pgvector

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vectordb
    ports:
      - "5433:5432"    # 5433 to avoid conflict with your local pgvector
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: