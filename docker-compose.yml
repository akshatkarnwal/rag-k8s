services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=pgvector
      - DB_PORT=5432
      - DB_NAME=vectordb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - pgvector

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vectordb
    ports:
      - "5433:5432"    # 5433 to avoid conflict with your local pgvector
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rag-k8s-redis
    ports:
      - "6380:6379"   # 6380 on host to avoid clashing with runbook-bot's Redis if both run locally
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build: .
    container_name: rag-k8s-celery-worker
    command: celery -A app.worker worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app   # only if your app service does this too, for hot-reload consistency

volumes:
  pgdata:
  redis-data:
