name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"

      - name: Install dependencies (from uv.lock, dev deps included)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
        env:
          JWT_SECRET_KEY: test-secret-key-not-for-production
          DEMO_USERNAME: testuser
          DEMO_PASSWORD_HASH: "$2b$12$x2v0NENKwzOqUQW6TYh/7.MTpbsjYwhB1aozQrAVjsZV80cJitXjS"