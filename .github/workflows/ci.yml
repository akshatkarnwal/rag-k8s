name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Reads your .python-version automatically, but pinning here
          # too makes the workflow self-documenting and independent of
          # that file ever changing silently
          python-version: "3.14"

      - name: Install dependencies (from uv.lock, dev deps included)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v